# Дополнение к серверу nginx образа serversideup (подключается из
# /etc/nginx/server-opts.d/). Перенесено из прежнего конфига сервера.

# Видео отдаёт nginx, а не PHP. VideoController::stream() возвращает пустой
# ответ с X-Accel-Redirect: /_protected_media/videos/<канал>/<id>.mp4, и nginx
# подставляет файл отсюда. internal — снаружи по этому адресу не попасть.
# Завершающий слэш в alias обязателен. ^~ — обязателен тоже: иначе регулярный
# location образа для медиафайлов (*.mp4 и т. п.) перехватывает внутренний
# редирект, и nginx зацикливается на /index.php. Если видео не играет, а API отвечает
# 200 с пустым телом, — потерялся этот location.
location ^~ /_protected_media/ {
    internal;
    alias /media/;
    sendfile on;
    tcp_nopush on;
    aio threads;
    output_buffers 4 256k;
}

# Сборка веб-клиента: имена с хешем — кешировать надолго.
location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# Обложки каналов (storage/app/public/thumbnails через симлинк public/storage).
location ^~ /storage/thumbnails/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# gzip уже включает сам образ (server-opts.d/performance.conf).

# WebSocket Reverb (сервис reverb в deploy/compose.yml): браузер подключается
# к тому же хосту и порту, что и страница, — по домену через Traefik и по IP:8000.
# Адрес — через переменную и resolver Docker: тогда nginx резолвит его при
# запросе, а не при старте, и api поднимается, даже если reverb ещё нет.
location /app/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $reverb_upstream http://reverb:8080;
    proxy_pass $reverb_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    access_log off;
}
